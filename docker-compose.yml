# Laboratorium 14 - PLIK BAZOWY
# Autor: Bartosz Owczarczyk
#
# Lab 14 - plik bazowy (wspolne dla wszystkich srodowisk)
# porty wyniesione do docker-compose.override.yml

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lab14_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html:ro
    depends_on:
      - php
    networks:
      - frontend
      - backend

  php:
    image: php:8.3-fpm-alpine
    container_name: lab14_php
    volumes:
      - ./src:/var/www/html
    networks:
      - backend

  mysql:
    image: mysql:8.4
    container_name: lab14_mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: lab14_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  dbdata:
    driver: local

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
